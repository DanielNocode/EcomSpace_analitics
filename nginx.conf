# EcomSpace Analytics — nginx reverse proxy configuration
# Supports HTTPS (Let's Encrypt), rate limiting, security headers

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_webhooks:10m rate=30r/m;

server {
    listen 80;
    server_name _;

    # Redirect HTTP to HTTPS (uncomment in production)
    # return 301 https://$host$request_uri;

    # For local/dev: proxy directly
    include /etc/nginx/conf.d/proxy.conf;
}

