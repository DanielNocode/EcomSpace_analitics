# Proxy configuration (included by server blocks)

# Security headers
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# Hide nginx version
server_tokens off;

# Client upload limit (for Bizon report upload)
client_max_body_size 50M;

# Frontend (React app)
location / {
    proxy_pass http://127.0.0.1:5173;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
}

# API general endpoints
location /api/ {
    limit_req zone=api_general burst=20 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
}

# Auth endpoints — stricter rate limiting (5 req/min)
location /api/auth/login {
    limit_req zone=api_auth burst=3 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
}

# Webhook endpoints
location /api/webhooks/ {
    limit_req zone=api_webhooks burst=10 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
    client_max_body_size 50M;
}
